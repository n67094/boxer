# Generate the markdown documentation from the headers and publish it to
# the boxerwiki repository.
#
# Requires the BOXERWIKI_TOKEN secret: a fine-grained token with
# "Contents: read and write" on n67094/boxerwiki.

name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate docs
        run: make docs

      - uses: actions/checkout@v4
        with:
          repository: n67094/boxerwiki
          ref: main
          token: ${{ secrets.BOXERWIKI_TOKEN }}
          path: boxerwiki

      # Files only maintained in boxerwiki are excluded so --delete keeps them.
      - name: Publish to boxerwiki
        run: |
          rsync -a --delete --exclude .git --exclude .github --exclude README.md build/docs/ boxerwiki/

          cd boxerwiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Docs are up to date."
            exit 0
          fi

          git commit -m "docs: boxer@${GITHUB_SHA::7}"
          git push
